name: lanna
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.0
  provider: ^6.0.5

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  speech_to_text: ^7.3.0
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.15.0
  flutter_tts: ^3.8.5

  file_picker: ^8.0.0

  permission_handler: ^11.3.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  camera: ^0.11.0+2
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    # PayapLanna (Main Lanna Unicode font)
    - family: PayapLanna
      fonts:
        - asset: assets/fonts/PayapLanna-Regular.ttf
        - asset: assets/fonts/PayapLanna-Bold.ttf
          weight: 700

    - family: LNTilok
      fonts:
        - asset: assets/fonts/PayapLanna-Regular.ttf
        - asset: assets/fonts/LN-TILOK-6.10.ttf

    - family: LannaFont
      fonts:
        - asset: assets/fonts/PayapLanna-Regular.ttf

    - family: LannaAkkhara
      fonts:
        - asset: assets/fonts/PayapLanna-Regular.ttf

    # NotoSansTaiTham
    - family: NotoSansTaiTham
      fonts:
        - asset: assets/fonts/NotoSansTaiTham.ttf

    # ✅ ฟอนต์หลักของแอป (ภาษาไทย)
    - family: THSarabunNew
      fonts:
        - asset: assets/fonts/THSarabunNew001.ttf

    - family: LMF Lukchin
      fonts:
        - asset: assets/fonts/THSarabunNew001.ttf
